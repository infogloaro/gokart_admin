# Local services for development. Start with `pnpm services:up`.
name: gokart

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gokart
      POSTGRES_PASSWORD: gokart
      POSTGRES_DB: gokart
    ports: ["5433:5432"] # 5433 on the host: a Windows PostgreSQL may already use 5432
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gokart"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis:/data]

  # Document storage (S3 API). MinIO stopped publishing public images on Docker Hub and
  # quay.io, so development uses Bitnami's archived MinIO build, pinned. It creates the
  # bucket on start. Console: http://localhost:9001 (gokart / gokart-minio).
  # Production uses real S3 (STORAGE_DRIVER=s3 with the bucket's own credentials).
  minio:
    image: bitnamilegacy/minio:2025.7.23
    environment:
      MINIO_ROOT_USER: gokart
      MINIO_ROOT_PASSWORD: gokart-minio
      MINIO_DEFAULT_BUCKETS: gokart-dev
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/bitnami/minio/data]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["1025:1025", "8025:8025"]

volumes:
  postgres:
  redis:
  minio:
